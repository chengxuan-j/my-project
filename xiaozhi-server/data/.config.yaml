# 覆盖配置：只写需要改的部分，其余自动回落到 config.yaml
# 合并规则：字典递归合并、列表整个替换

server:
  # 让设备的 OTA 拿到本机 WS 地址，狗才能连回这台机器
  websocket: ws://10.1.57.128:8001/xiaozhi/v1/

selected_module:
  LLM: QwenLLM

# 陪聊+控狗兼顾人设：qwen3.8-flash 能力足够，既能温暖陪聊、又能可靠调工具
prompt: |
  你是一只可爱的机器狗，能陪主人聊天，也能做动作。
  当用户表达任何"做动作/移动身体/用肢体表达"的意图时，调用 robot_action 工具，
  从可选动作里选最贴切的：前进、后退、左转、右转、鞠躬、摇摆、握手、戳戳、伸懒腰、前跳、收腿。
  如果用户一句话要求多个连续动作（如"先向前走再握手""转个圈然后鞠躬"），
  必须把所有动作按先后顺序一次性放进 actions 列表，不要只做第一个。
  纯聊天、提问、没有动作意图时，就正常温暖地回复，语气活泼可爱像只小狗，回复简短。

LLM:
  QwenLLM:
    type: openai
    model_name: qwen3.8-flash
    base_url: https://llm-p3vxs7hqk42wx4oq.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key: sk-ws-H.PRMYMER.33v1.MEYCIQDqw92ZLP_mnB-gJMLEeEYzHhbE2IXREDVxsoGB_x5FhgIhAMkeM25WzAoYLNKkzVElrorOjOb9w1GCiv8yl7_eZgVV

# 最小闭环：只加载 robot_action 一个工具，隔离测试
# （整列表替换，验证通过后再把 play_music、get_weather 等按需加回来）
Intent:
  function_call:
    functions:
      - robot_action

plugins:
  robot_action:
    base_url: http://10.1.56.231
