<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机器狗语音控制</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1220; color: #e6e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; font-weight: 600; }
  .status { font-size: 13px; margin-bottom: 16px; color: #8a8fa3; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #e05555; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #4ade80; }
  .panel { width: 100%; max-width: 480px; }
  #log {
    background: #171a2b; border-radius: 12px; padding: 12px; height: 300px;
    overflow-y: auto; margin-bottom: 16px; font-size: 14px; line-height: 1.5;
  }
  .msg { margin-bottom: 10px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 8px 12px; border-radius: 12px; max-width: 80%; word-break: break-word; }
  .user .bubble { background: #3b82f6; color: #fff; }
  .bot .bubble { background: #262a40; }
  .sys .bubble { background: transparent; color: #8a8fa3; font-size: 12px; font-style: italic; }
  #micBtn {
    width: 100%; padding: 18px; font-size: 17px; font-weight: 600; border: none;
    border-radius: 12px; background: #3b82f6; color: #fff; cursor: pointer;
    transition: background .2s; margin-bottom: 12px;
  }
  #micBtn.rec { background: #e05555; animation: pulse 1s infinite; }
  #micBtn:disabled { background: #2a2e44; color: #6b7086; cursor: not-allowed; }
  @keyframes pulse { 50% { opacity: .7; } }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .actions button {
    padding: 10px 4px; font-size: 14px; border: 1px solid #2a2e44; border-radius: 10px;
    background: #1c2036; color: #e6e8f0; cursor: pointer; transition: background .15s;
  }
  .actions button:hover { background: #262a40; }
  .actions button:active { background: #3b82f6; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2a2e44;
    background: #171a2b; color: #e6e8f0; font-size: 14px;
  }
  .row button {
    padding: 12px 16px; border: none; border-radius: 10px; background: #4ade80;
    color: #0f1220; font-weight: 600; cursor: pointer;
  }
  .hint { font-size: 12px; color: #6b7086; margin: 4px 0 12px; }
  .vision { margin-top: 16px; border-top: 1px solid #2a2e44; padding-top: 16px; }
  .vision-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .vision-head h2 { font-size: 15px; font-weight: 600; }
  #camBtn {
    padding: 8px 14px; font-size: 14px; border: none; border-radius: 10px;
    background: #4ade80; color: #0f1220; font-weight: 600; cursor: pointer;
  }
  #camBtn.on { background: #e05555; color: #fff; }
  #camWrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; display: none; }
  #camWrap.show { display: block; }
  #camVideo { display: none; }
  #camCanvas { width: 100%; display: block; }
  #camStatus { font-size: 12px; color: #8a8fa3; margin-top: 6px; }
  .cheatsheet { font-size: 11px; color: #6b7086; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>🐕 机器狗语音控制</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
  <div class="status" id="dogStatus">机器狗连接检测中…</div>
  <div class="panel">
    <div id="log"></div>
    <button id="micBtn" disabled>🎤 按住说话 / 点击开始</button>
    <div class="row">
      <input id="textInput" placeholder="也可以直接输入指令，如：握个手" />
      <button id="sendBtn">发送</button>
    </div>
    <div class="hint">快捷动作（直接下发给机器狗）：</div>
    <div class="actions" id="quickActions"></div>

    <div class="vision">
      <div class="vision-head">
        <h2>📷 手势控制</h2>
        <button id="camBtn">开启摄像头</button>
      </div>
      <div id="camWrap">
        <video id="camVideo" playsinline muted></video>
        <canvas id="camCanvas"></canvas>
      </div>
      <div id="camStatus">摄像头未开启</div>
      <div class="cheatsheet">
        双手高举→前进 ｜ 举左手→左转 ｜ 举右手→右转 ｜ T字→停止<br>
        双手抱头/下蹲→鞠躬 ｜ 张开手掌→握手 ｜ 竖大拇指→伸懒腰 ｜ 剪刀手→摇摆
      </div>
    </div>
  </div>
  <script src="app.js?v=dog-relay-2"></script>
  <script type="module" src="vision-ui.js?v=dog-relay"></script>
</body>
</html>
