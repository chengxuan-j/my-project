<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老人情感陪伴助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5efe6; color: #3a3226;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .app { width: 100%; max-width: 860px; display: flex; gap: 16px; }
  .chat-col { flex: 1; min-width: 0; }
  .side-col { width: 250px; flex-shrink: 0; }
  h1 { font-size: 22px; margin-bottom: 4px; color: #7a5c2e; }
  .sub { font-size: 14px; color: #8a7a5f; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; color: #9c7c3f; margin-bottom: 8px; border-bottom: 1px dashed #e5d9bf; padding-bottom: 6px; }
  #msgs { min-height: 320px; max-height: 480px; overflow-y: auto; padding: 4px; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  .user .bubble { background: #f0dfc0; border-bottom-right-radius: 4px; }
  .ai .bubble { background: #eef3ea; border-bottom-left-radius: 4px; }
  .input-row { display: flex; gap: 10px; margin-top: 10px; }
  #input { flex: 1; font-size: 17px; padding: 12px 14px; border: 1px solid #d8c9a8; border-radius: 10px; outline: none; }
  #input:focus { border-color: #b8965a; }
  #send { font-size: 17px; padding: 12px 26px; background: #b8965a; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  #send:disabled { background: #cfc3a9; cursor: wait; }
  .state b { color: #7a5c2e; }
  .state div { margin: 4px 0; font-size: 15px; }
  .mem-list { font-size: 14px; line-height: 1.9; }
  .mem-list li { list-style: none; }
  .tag { display:inline-block; background:#efe6d2; border-radius:6px; padding:0 6px; margin-right:4px; font-size:12px; color:#8a6d3b; }
  .rec-btns button { width: 100%; margin-bottom: 8px; padding: 10px; font-size: 15px; border: 1px solid #d8c9a8; background: #fbf6ec; border-radius: 8px; cursor: pointer; }
  .rec-btns button:disabled { opacity: .5; cursor: not-allowed; }
  #who { font-size: 14px; color: #8a7a5f; }
  .placeholder { color: #b0a58e; font-size: 13px; }
  .recalled { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e5d9bf; font-size: 13px; color: #6d8a5a; }
  .recalled .ph2 { color: #8a7a5f; margin-bottom: 2px; }
  .muted { color: #a8977a; font-size: 13px; }
  .degraded { color: #c99a3a; font-size: 12px; font-weight: normal; }
  .risk { font-weight: bold; }
  .risk-medium { color: #c99a3a; }
  .risk-high { color: #c0392b; }
  .trend { display: flex; gap: 6px; flex-wrap: wrap; }
  .trend .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #efe6d2; color: #6b5a3a; }
  .trend .chip.neg { background: #f3d9d3; color: #a4492f; }
  .trace { margin-top: 6px; padding: 8px 10px; background: #fbf7ee; border: 1px dashed #e0d2b2;
           border-radius: 8px; font-size: 12px; color: #6b5a3a; }
  .trace-row { display: flex; gap: 6px; margin: 3px 0; align-items: baseline; }
  .trace-row .t-ico { flex: 0 0 auto; }
  .trace-row .t-label { flex: 0 0 auto; font-weight: bold; color: #9c7c3f; }
  .trace-row .t-val { word-break: break-all; }
  .play-btn { margin-top: 5px; font-size: 12px; padding: 3px 10px; border: 1px solid #d8c9a8;
              background: #fbf6ec; color: #8a6d3b; border-radius: 6px; cursor: pointer; }
  .play-btn:hover { background: #efe6d2; }
  #mic { font-size: 16px; padding: 10px 16px; background: #f0dfc0; border: 1px solid #d8c9a8;
         border-radius: 10px; cursor: pointer; }
  #mic:disabled { opacity: .5; cursor: wait; }
  #mic.recording { background: #e8b4a0; border-color: #c98a72; }
  @media (max-width: 720px) { .app { flex-direction: column; } .side-col { width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <div class="chat-col">
    <h1>老人情感陪伴助手</h1>
    <div class="sub">
      老人姓名：<b id="elder-name">王阿姨</b>
      <span id="who">（elderly_001）</span>
    </div>
    <div class="card">
      <div id="msgs"><div class="msg ai"><div class="bubble">您好呀，我是您的陪伴助手。今天过得怎么样？</div></div></div>
      <div class="input-row">
        <input id="input" placeholder="输入聊天内容，例如：今天有点无聊。" autocomplete="off">
        <button id="mic" title="按住说话（语音识别）">🎤</button>
        <button id="send">发送</button>
      </div>
      <div id="mic-hint" class="muted" style="display:none;margin-top:6px">正在录音 <span id="mic-timer">0.0</span> 秒（建议 ≥1 秒）…</div>
    </div>
  </div>

  <div class="side-col">
    <div class="card state">
      <h2>当前状态 <span id="st-degraded" class="degraded" style="display:none">（分析降级）</span></h2>
      <div>当前情绪：<b id="st-emotion">平静</b> <span id="st-intensity" class="muted"></span></div>
      <div>意图识别：<b id="st-intent">—</b></div>
      <div>当前场景：<b id="st-scene">对话中</b></div>
      <div>当前主题：<b id="st-topic">—</b></div>
      <div id="st-risk-row" style="display:none">风险提示：<b id="st-risk" class="risk"></b></div>
      <div style="margin-top:6px"><span class="muted">情绪趋势：</span><span id="st-trend" class="trend"></span></div>
    </div>
    <div class="card">
      <h2>老人画像 / 长期记忆</h2>
      <ul class="mem-list" id="mem-list">
        <li class="placeholder">加载中…</li>
      </ul>
      <div id="recalled" class="recalled" style="display:none"></div>
    </div>
    <div class="card rec-btns">
      <h2>推荐</h2>
      <button id="btn-music">🎵 音乐</button>
      <button id="btn-story">📖 故事</button>
      <button id="btn-game">🧩 游戏</button>
      <div id="rec-result" class="recalled" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const USER_ID = new URLSearchParams(location.search).get("user") || "elderly_001";
const msgs = document.getElementById("msgs");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const EMOTION_CN = {neutral:"平静", lonely:"孤独", sad:"难过", bored:"无聊", happy:"开心", anxious:"焦虑", angry:"生气", tired:"疲惫", nostalgic:"怀旧", grateful:"欣慰", worried:"担忧"};
const SCENE_CN = {conversation:"对话中", alone:"独自在家", family_visit:"家人陪伴", mealtime:"吃饭时间", morning:"清晨", evening:"傍晚", outdoor:"户外", rest:"休息中"};
const INTENT_CN = {casual_chat:"闲聊", emotional_sharing:"情感倾诉", question:"提问", music_request:"想听歌", story_request:"想听故事", game_request:"想玩游戏", greeting:"打招呼", memory_recall:"唤起回忆", advice_request:"想要建议", family_talk:"聊家人", health_concern:"身体不适", safety_alert:"需要关注", other:"其他"};
const RISK_CN = {low:"", medium:"需要留意", high:"⚠️ 高风险"};

document.getElementById("who").textContent = "（" + USER_ID + "）";

function addMsg(role, text, trace) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  const wrap = document.createElement("div");
  wrap.style.maxWidth = "78%";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.appendChild(b);
  if (role === "ai") {
    const play = document.createElement("button");
    play.className = "play-btn";
    play.textContent = "🔊 播放";
    play.title = "语音播放";
    play.onclick = () => playSpeech(text);
    wrap.appendChild(play);
  }
  if (trace) wrap.appendChild(buildTrace(trace));
  d.appendChild(wrap);
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

let _audio = null;
async function playSpeech(text) {
  const btn = event && event.target;
  try {
    if (btn) { btn.textContent = "…合成中"; btn.disabled = true; }
    const r = await fetch("/speech/tts", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text}),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "合成失败");
    if (_audio) { _audio.pause(); _audio = null; }
    _audio = new Audio(d.audio_url);
    _audio.play();
    if (btn) { btn.textContent = "🔊 播放"; btn.disabled = false; }
  } catch (e) {
    if (btn) { btn.textContent = "🔊 播放"; btn.disabled = false; }
    alert("语音播放失败：" + e.message);
  }
}

function buildTrace(t) {
  // 决策过程可视化：情绪 → 意图/场景 → 动作(理由) → 推荐 → 记忆
  const box = document.createElement("div");
  box.className = "trace";
  const steps = [];
  const emo = EMOTION_CN[t.emotion] || t.emotion;
  const pct = Math.round((t.emotion_intensity || 0) * 100);
  steps.push({ icon: "🧠", label: "情绪", val: emo + (pct ? " " + pct + "%" : "") });
  steps.push({ icon: "🎯", label: "意图", val: INTENT_CN[t.intent] || t.intent || "—" });
  steps.push({ icon: "📍", label: "场景", val: SCENE_CN[t.scene] || t.scene || "—" });

  const ACTION_CN = {empathetic_chat:"共情陪伴", continue_listening:"继续倾听", ask_gentle_question:"温和提问",
    recommend_music:"推荐音乐", recommend_story:"推荐故事", recommend_game:"推荐游戏",
    recommend_content:"推荐内容", daily_greeting:"日常问候", encourage_family_contact:"鼓励联系家人",
    safety_escalation:"安全升级"};
  steps.push({ icon: "⚡", label: "动作", val: (ACTION_CN[t.action] || t.action || "—") + (t.action_reason ? " · " + t.action_reason : "") });

  if (t.recommendation && t.recommendation.title) {
    const rec = t.recommendation;
    const rv = rec.artist ? "《" + rec.title + "》" + rec.artist : "《" + rec.title + "》";
    steps.push({ icon: "🎵", label: "推荐", val: rv + (rec.reason ? " · " + rec.reason : "") });
  }
  if (t.recalled_memories && t.recalled_memories.length) {
    steps.push({ icon: "🗂", label: "记忆", val: t.recalled_memories.join("；") });
  }

  steps.forEach(s => {
    const row = document.createElement("div");
    row.className = "trace-row";
    row.innerHTML = "<span class='t-ico'>" + s.icon + "</span>" +
      "<span class='t-label'>" + s.label + "</span>" +
      "<span class='t-val'>" + s.val + "</span>";
    box.appendChild(row);
  });
  return box;
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  addMsg("user", text);
  sendBtn.disabled = true;
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: USER_ID, message: text}),
    });
    const data = await r.json();
    if (!r.ok) { addMsg("ai", "⚠️ " + (data.detail || "服务异常")); }
    else {
      addMsg("ai", data.reply, {
        emotion: data.emotion, emotion_intensity: data.emotion_intensity,
        intent: data.intent, scene: data.scene, action: data.action,
        action_reason: data.action_reason, recommendation: data.recommendation,
        recalled_memories: data.recalled_memories || [],
      });
      document.getElementById("elder-name").textContent = data.name || "老人家";
      document.getElementById("st-emotion").textContent = EMOTION_CN[data.emotion] || data.emotion;
      const pct = Math.round((data.emotion_intensity || 0) * 100);
      document.getElementById("st-intensity").textContent =
        data.emotion && data.emotion !== "neutral" ? pct + "%" : "";
      document.getElementById("st-intent").textContent = INTENT_CN[data.intent] || data.intent || "—";
      document.getElementById("st-scene").textContent = SCENE_CN[data.scene] || data.scene;
      document.getElementById("st-topic").textContent = data.topic || "—";
      document.getElementById("st-degraded").style.display = data.degraded ? "inline" : "none";
      const riskRow = document.getElementById("st-risk-row");
      if (data.risk_level && data.risk_level !== "low") {
        riskRow.style.display = "block";
        const el = document.getElementById("st-risk");
        el.textContent = RISK_CN[data.risk_level] || data.risk_level;
        el.className = "risk risk-" + data.risk_level;
      } else {
        riskRow.style.display = "none";
      }
      showRecalled(data.recalled_memories || []);
      // 本轮可能写入了新的长期记忆/情绪记录，稍后刷新
      loadTrend();
      setTimeout(loadProfile, 3500);
    }
  } catch (e) {
    addMsg("ai", "⚠️ 网络错误：" + e.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function showRecalled(list) {
  const el = document.getElementById("recalled");
  if (!list.length) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = "<div class='ph2'>本轮引用：</div>" + list.map(x => "· " + x).join("<br>");
}

const NEG_EMOTIONS = ["lonely", "sad", "bored", "anxious", "angry", "worried", "tired"];
async function loadTrend() {
  try {
    const r = await fetch("/emotion/" + encodeURIComponent(USER_ID) + "?limit=8");
    if (!r.ok) return;
    const recs = (await r.json()).records || [];
    const el = document.getElementById("st-trend");
    if (!recs.length) { el.innerHTML = "<span class='muted'>暂无</span>"; return; }
    // records 为倒序，展示按时间正序
    el.innerHTML = recs.slice().reverse().map(x => {
      const neg = NEG_EMOTIONS.includes(x.emotion);
      return "<span class='chip" + (neg ? " neg" : "") + "'>" +
             (EMOTION_CN[x.emotion] || x.emotion) + "</span>";
    }).join("");
  } catch (e) {}
}

async function loadProfile() {
  try {
    const r = await fetch("/profile/" + encodeURIComponent(USER_ID));
    if (!r.ok) return;
    const p = await r.json();
    document.getElementById("elder-name").textContent = p.name;
    const items = [];
    if (p.family?.length) items.push("<span class='tag'>家人</span>" + p.family.join("、"));
    if (p.interests?.length) items.push("<span class='tag'>兴趣</span>" + p.interests.join("、"));
    if (p.favorite_music?.length) items.push("<span class='tag'>音乐</span>" + p.favorite_music.join("、"));
    if (p.life_experience?.length) items.push("<span class='tag'>经历</span>" + p.life_experience.join("；"));

    // 长期记忆列表
    try {
      const mr = await fetch("/memories/" + encodeURIComponent(USER_ID));
      if (mr.ok) {
        const mems = (await mr.json()).memories || [];
        mems.slice(0, 6).forEach(m => {
          items.push("<span class='tag'>" + m.memory_type + "</span>" + m.content);
        });
      }
    } catch (e) {}

    document.getElementById("mem-list").innerHTML =
      items.map(x => "<li>" + x + "</li>").join("") || "<li class='placeholder'>暂无画像信息</li>";
  } catch (e) { /* 静默 */ }
}

function showRecResult(html) {
  const el = document.getElementById("rec-result");
  if (!html) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = html;
}

async function recommendMusic() {
  const r = await fetch("/recommend/music", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: USER_ID}),
  });
  if (!r.ok) { showRecResult("⚠️ 获取失败"); return; }
  const d = await r.json();
  const html = (d.items || []).slice(0, 4).map(m =>
    "<div style='margin:4px 0'>🎵 <b>" + m.title + "</b> · " + m.artist +
    "<div class='muted'>" + m.reason + "</div></div>"
  ).join("") || "暂无推荐";
  showRecResult(html);
}

async function recommendStory() {
  const r = await fetch("/recommend/story", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: USER_ID}),
  });
  if (!r.ok) { showRecResult("⚠️ 获取失败"); return; }
  const d = await r.json();
  const html = (d.items || []).slice(0, 3).map(s =>
    "<div style='margin:4px 0'>📖 <b>" + s.title + "</b>" +
    "<div class='muted'>" + s.summary + "</div></div>"
  ).join("") || "暂无推荐";
  showRecResult(html);
}

async function newGame() {
  const r = await fetch("/game/new", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: USER_ID, game: "arithmetic", difficulty: "easy"}),
  });
  if (!r.ok) { showRecResult("⚠️ 获取失败"); return; }
  const d = await r.json();
  showRecResult("🧩 来算一题：" + d.prompt +
    "<div class='muted'>在聊天框输入答案，我会帮您判题（示例玩法，判题走 /game/check）</div>");
}

// ---------- 语音识别（按住说话） ----------
let _recorder = null;
let _chunks = [];
let _stream = null;
let _recStartedAt = 0;     // 录音起始时间戳（用于实时显示时长）
let _recTimer = null;
const micBtn = document.getElementById("mic");
const micHint = document.getElementById("mic-hint");
const micTimer = document.getElementById("mic-timer");

// 浏览器 MediaRecorder 录出的是 webm（DashScope 识别不稳），
// 这里用 AudioContext 解成 PCM 再编码成标准 wav 上传。
function writeStr(view, offset, s) {
  for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
}

function audioBufferToWav(buf) {
  const ch = buf.numberOfChannels, rate = buf.sampleRate, bits = 16;
  const blockAlign = ch * bits / 8;
  const dataSize = buf.length * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize);
  const v = new DataView(ab);
  writeStr(v, 0, "RIFF");  v.setUint32(4, 36 + dataSize, true);
  writeStr(v, 8, "WAVE");  writeStr(v, 12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * blockAlign, true);
  v.setUint16(32, blockAlign, true); v.setUint16(34, bits, true);
  writeStr(v, 36, "data"); v.setUint32(40, dataSize, true);
  let off = 44;
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  for (let i = 0; i < buf.length; i++) {
    for (let c = 0; c < ch; c++) {
      const s = Math.max(-1, Math.min(1, chans[c][i]));
      v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

async function startRecording() {
  try {
    _stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recorder = new MediaRecorder(_stream);
    _chunks = [];
    _recorder.ondataavailable = e => { if (e.data.size) _chunks.push(e.data); };
    _recorder.onstop = onRecordingStop;
    _recorder.start();
    micHint.style.display = "block";
    micBtn.textContent = "⏺";
    micBtn.classList.add("recording");
    // 实时秒表：避免用户不知道按住多久就松手
    _recStartedAt = Date.now();
    micTimer.textContent = "0.0";
    _recTimer = setInterval(() => {
      const sec = (Date.now() - _recStartedAt) / 1000;
      if (micTimer) micTimer.textContent = sec.toFixed(1);
    }, 100);
  } catch (e) {
    alert("无法使用麦克风：" + e.message + "\n（需 HTTPS 或 localhost，且已授权麦克风）");
  }
}

function stopRecording() {
  if (_recTimer) { clearInterval(_recTimer); _recTimer = null; }
  if (_recorder && _recorder.state !== "inactive") {
    _recorder.stop();
    micHint.style.display = "none";
    micBtn.textContent = "🎤";
    micBtn.classList.remove("recording");
    micBtn.disabled = true;
  }
}

function releaseStream() {
  if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
}

async function onRecordingStop() {
  input.placeholder = "识别中，请稍候（可能需要 30~60 秒）…";
  try {
    const rawBlob = new Blob(_chunks, { type: _recorder.mimeType || "audio/webm" });
    const heldSec = ((Date.now() - _recStartedAt) / 1000).toFixed(1);
    releaseStream();
    if (!rawBlob.size) {
      input.placeholder = `没录到声音（按住 ${heldSec}s），请按住久一点再试`;
      return;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const ab = await rawBlob.arrayBuffer();
    const decoded = await ctx.decodeAudioData(ab);
    const wavBlob = audioBufferToWav(decoded);
    ctx.close();
    const audioSec = decoded.duration.toFixed(1);

    // 异步转写：先提交，拿 task_id；再轮询 GET 直到完成
    const fd = new FormData();
    fd.append("file", wavBlob, "recording.wav");
    const sub = await fetch("/speech/asr/submit", { method: "POST", body: fd });
    const subData = await sub.json();
    if (!sub.ok) throw new Error(subData.detail || "提交识别失败");
    const taskId = subData.task_id;
    if (!taskId) throw new Error("未拿到转写任务 id");

    input.placeholder = `识别中（已提交，每 1.5s 轮询一次）…`;
    const text = await pollAsrResult(taskId, 120000, 1500);
    if (text) {
      input.placeholder = `本次录音 ${audioSec}s`;
      input.value = text;
      send();
    } else {
      input.placeholder = `没听清（录音 ${audioSec}s），请再说一次`;
    }
  } catch (e) {
    releaseStream();
    alert("语音识别失败：" + e.message);
  } finally {
    micBtn.disabled = false;
  }
}

// 轮询 ASR 结果：最长 waitMs，每 intervalMs 查一次
async function pollAsrResult(taskId, waitMs = 120000, intervalMs = 1500) {
  const deadline = Date.now() + waitMs;
  let lastStatus = "";
  while (Date.now() < deadline) {
    let r;
    try {
      r = await fetch(`/speech/asr/${taskId}`);
    } catch (e) {
      // 网络抖动：等待后重试，不立刻失败
      await new Promise(res => setTimeout(res, intervalMs));
      continue;
    }
    const d = await r.json();
    lastStatus = d.status || "";
    if (d.status === "SUCCEEDED") {
      return d.text || "";
    }
    if (d.status === "FAILED" || d.status === "CANCELED") {
      throw new Error(d.error || "转写任务失败");
    }
    // PENDING / RUNNING：等待
    await new Promise(res => setTimeout(res, intervalMs));
  }
  throw new Error("识别超时（>120s）" + (lastStatus ? `，最后状态：${lastStatus}` : ""));
}

// 松开鼠标/抬手指在 document 层监听：鼠标移出按钮再松开也能正常停止
document.addEventListener("mouseup", () => { if (_recorder) stopRecording(); });
document.addEventListener("touchend", () => { if (_recorder) stopRecording(); });
micBtn.addEventListener("mousedown", e => { e.preventDefault(); startRecording(); });
micBtn.addEventListener("touchstart", e => { e.preventDefault(); startRecording(); });

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("btn-music").addEventListener("click", recommendMusic);
document.getElementById("btn-story").addEventListener("click", recommendStory);
document.getElementById("btn-game").addEventListener("click", newGame);
loadProfile();
loadTrend();
